<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Why are the rich getting richer and the poor getting poorer?" />
    <link rel="stylesheet" href="styles.css" />
    <title>Blog Post Card</title>
  </head>
  <body>
    <main>
      <div class="blog-post-card">
        <img
          class="post-img"
          src="images/rich.jpeg"
          alt="A man with a beautiful gray mustache, in a tuxedo and with bags of money run, while the others look after him."
        />
        <div class="post-content">
          <h2 class="post-title">Why are the rich getting richer and the poor getting poorer?</h2>
          <p class="post-excerpt">
            The wealthy own appreciating assets (stocks, real estate) that build wealth, while lower-income groups often
            rely on labor income and face rising inflation, creating a widening wealth gap.
          </p>
          <a href="#" class="read-more">Read More</a>
        </div>
      </div>
    </main>
  </body>
</html>
