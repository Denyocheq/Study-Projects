<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Just a drawing of a house and that's it :)" />
    <link rel="stylesheet" href="styles.css" />
    <title>House Painting</title>
  </head>
  <body>
    <div class="container">
      <div id="house">
        <div id="chimney">
          <div id="chimney-upper-part"></div>
        </div>
        <div id="roof">
          <div id="roof-window"></div>
        </div>
        <div id="window-1">
          <div id="cat">
            <div id="cat-head">
              <div id="left-eye"></div>
              <div id="right-eye"></div>
              <div id="cat-mouth"></div>
            </div>
            <div id="left-ear"></div>
            <div id="right-ear"></div>
            <div id="cat-neck"></div>
          </div>
        </div>
        <div id="window-2"></div>
        <div id="door">
          <div id="door-window"></div>
        </div>
        <div id="hallway"></div>
        <div id="hallway-roof"></div>
      </div>
    </div>
  </body>
</html>
