<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Choose the ideal hosting plan for your project. Automatic scaling, DDoS protection, SSL certificate, and control panel. Launch your site in 1 minute!">
    <link rel="stylesheet" href="styles.css">
    <title>Selection Feature</title>
</head>

<body>
    <h1>Feature Selection</h1>
    <div class="feature-card-container">
        <label class="feature-card">
            <input type="checkbox" name="high-performance"> <h2>High Performance</h2>
            <p>Servers based on NVMe SSD and Intel Xeon processors. Average website loading speed up to 300 ms.</p>
        </label>
        <label class="feature-card">
            <input type="checkbox" name="comprehensive-protection"> <h2>Comprehensive Protection</h2>
            <p>Free SSL certificate, automatic backups, and built-in DDoS protection 24/7.</p>
        </label>
        <label class="feature-card">
            <input type="checkbox" name="grow-without-limits"> <h2>Grow Without Limits</h2>
            <p>Automatic resource scaling during traffic spikes. Resources are not restricted by rigid plan limits.</p>
        </label>
        <label class="feature-card">
            <input type="checkbox" name="user-friendly-control-panel"> <h2>User-Friendly Control Panel</h2>
            <p>Intuitive cPanel/ISPmanager to manage files, databases, and domains in just a few clicks.</p>
        </label>
        <label class="feature-card">
            <input type="checkbox" name="support"> <h2>24/7 Support</h2>
            <p>Round-the-clock technical support via chat and phone. Average response time — 45 seconds.</p>
        </label>
        <label class="feature-card">
            <input type="checkbox" name="quick-start"> <h2>Quick Start</h2>
            <p>One-click automatic installation of WordPress and 300+ CMS. Free website migration from another host.</p>
        </label>
    </div>
</body>

</html>
