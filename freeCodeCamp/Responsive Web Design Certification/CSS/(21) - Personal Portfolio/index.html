<!doctype html>
<html lang="en" class="root">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Denis, a beginner developer, has a portfolio. Academic projects that prove I'm a fast learner and can apply my knowledge in practice. I'm open to internships and real-world challenges."
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Zen+Dots&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="styles.css" />
    <title>Denyocheq</title>
  </head>
  <body class="page">
    <header>
      <nav class="navbar">
        <div class="navbar__logo"><a class="navbar__logo-link" href="#welcome-section">DQ</a></div>
        <ul class="navbar__list">
          <li><a class="navbar__link" href="#project-section">Projects</a></li>
          <li><a class="navbar__link" href="#contact-section">Contact</a></li>
        </ul>
      </nav>
    </header>
    <main class="main">
      <section id="welcome-section" class="welcome-section">
        <div class="welcome-text">
          <h1 class="welcome-text__heading"><span class="welcome-text__prefix">I &nbsp;am</span> Denyocheq</h1>
          <div class="welcome-text__position">Frontend Developer</div>
        </div>
        <a href="#project-section" class="scroll-down">← scroll</a>
      </section>
      <section id="project-section" class="project-section">
        <h2 class="project-section__heading">Projects</h2>
        <div class="project-section__cards">
          <div class="project-section__card">
            <a
              class="project-section__card-link"
              href="https://denyocheq.github.io/Study-Projects/freeCodeCamp/Responsive%20Web%20Design%20Certification/CSS/(19)%20-%20Product%20Landing%20Page%20%5BCertification%20Project%5D/"
              target="_blank"
              ><img class="project-section__card-image" src="images/mallow.png" alt="Mallow project preview"
            /></a>
          </div>
          <div class="project-section__card">
            <a
              class="project-section__card-link"
              href="https://denyocheq.github.io/Study-Projects/Pet%20Projects/Konstruct/"
              target="_blank"
              ><img class="project-section__card-image" src="images/konstruct.png" alt="Konstruct project preview"
            /></a>
          </div>
          <div class="project-section__card">
            <a
              class="project-section__card-link"
              href="https://denyocheq.github.io/Study-Projects/freeCodeCamp/Responsive%20Web%20Design%20Certification/CSS/(13)%20-%20Tribute%20Page/"
              target="_blank"
              ><img
                class="project-section__card-image"
                src="images/tribute-page.png"
                alt="Tribute Page project preview"
            /></a>
          </div>
        </div>
        <div class="project-section__text">Slide it ⟶</div>
        <a href="#contact-section" class="scroll-down">← scroll</a>
      </section>
      <section id="contact-section" class="contact-section">
        <div class="contact-section__question">
          <h2 class="contact-section__question-heading">Business question or just stumbled across this page?</h2>
          <div class="contact-section__cta-text">Anyway - write</div>
        </div>
        <div>
          <h2 class="contact-section__heading">Contact</h2>
          <form action="#welcome-section" class="contact-form">
            <input class="contact-form__input" type="text" name="name" placeholder="Your name" />
            <input class="contact-form__input" type="number" name="phone" placeholder="Your phone" />
            <input class="contact-form__input" type="email" name="email" placeholder="Your email" />
            <textarea
              class="contact-form__textarea"
              type="text"
              name="message"
              cols="25"
              rows="5"
              placeholder="Message"
            ></textarea>
            <button class="contact-form__submit" type="submit">Send message</button>
          </form>
        </div>
      </section>
    </main>
    <footer class="social-media">
      <a class="social-media__link" href="https://t.me/Denyocheq" target="_blank">
        <i class="social-media__icon fab fa-telegram" aria-label="Telegram"></i>
      </a>
      <a class="social-media__link" href="https://github.com/Denyocheq" target="_blank" id="profile-link">
        <i class="social-media__icon fab fa-github" aria-label="Github"></i>
      </a>
      <a class="social-media__link" href="https://www.freecodecamp.org/Denyocheq" target="_blank">
        <i class="social-media__icon fab fa-free-code-camp" aria-label="freeCodeCamp"></i>
      </a>
    </footer>
  </body>
</html>
