<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Denis, a beginner developer, has a portfolio. Academic projects that prove I'm a fast learner and can apply my knowledge in practice. I'm open to internships and real-world challenges."
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Zen+Dots&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="styles.css" />
    <title>Denyocheq</title>
  </head>
  <body>
    <header>
      <nav id="navbar">
        <div class="logo"><a href="#welcome-section">DQ</a></div>
        <ul>
          <li><a href="#project-section">Projects</a></li>
          <li><a href="#contact-section">Contact</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section id="welcome-section">
        <div class="welcome-text">
          <h1><span>I &nbsp;am</span> Denyocheq</h1>
          <div class="position">Frontend Developer</div>
        </div>
        <a href="#project-section" class="scroll-down">← scroll</a>
      </section>
      <section id="project-section">
        <h2>Projects</h2>
        <div class="project-tiles">
          <div class="project-tile">
            <a
              href="https://denyocheq.github.io/Study-Projects/freeCodeCamp/Responsive%20Web%20Design%20Certification/CSS/(19)%20-%20Product%20Landing%20Page%20%5BCertification%20Project%5D/"
              target="_blank"
              ><img src="images/mallow.png" alt="Mallow project preview"
            /></a>
          </div>
          <div class="project-tile">
            <a href="https://denyocheq.github.io/Study-Projects/Pet%20Projects/Konstruct/" target="_blank"
              ><img src="images/konstruct.png" alt="Konstruct project preview"
            /></a>
          </div>
          <div class="project-tile">
            <a
              href="https://denyocheq.github.io/Study-Projects/freeCodeCamp/Responsive%20Web%20Design%20Certification/CSS/(13)%20-%20Tribute%20Page/"
              target="_blank"
              ><img src="images/tribute-page.png" alt="Tribute Page project preview"
            /></a>
          </div>
        </div>
        <div class="slide-it">Slide it ⟶</div>
        <a href="#contact-section" class="scroll-down">← scroll</a>
      </section>
      <section id="contact-section">
        <div class="question">
          <h2>Business question or just stumbled across this page?</h2>
          <div class="CTA-text">Anyway - write</div>
        </div>
        <div>
          <h2>Contact</h2>
          <form action="#welcome-section">
            <input type="text" name="name" placeholder="Your name" />
            <input type="number" name="phone" placeholder="Your phone" />
            <input type="email" name="email" placeholder="Your email" />
            <textarea type="text" name="message" cols="25" rows="5" placeholder="Message"></textarea>
            <button type="submit">Send message</button>
          </form>
        </div>
      </section>
    </main>
    <footer class="social-media">
      <a href="https://t.me/Denyocheq" target="_blank" class="social-icon">
        <i class="fab fa-telegram" aria-label="Telegram"></i>
      </a>
      <a href="https://github.com/Denyocheq" target="_blank" id="profile-link" class="social-icon">
        <i class="fab fa-github" aria-label="Github"></i>
      </a>
      <a href="https://www.freecodecamp.org/Denyocheq" target="_blank" class="social-icon">
        <i class="fab fa-free-code-camp" aria-label="freeCodeCamp"></i>
      </a>
    </footer>
  </body>
</html>
