 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="description" content="This is my to-do list for today.">
    <title>To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main>
        <h1>To-Do list for today</h1>
        <ul class="todo-list">
            <li>
                <input type="checkbox" id="watch-video">
                <label for="watch-video">Watch a video about the structure of cars.</label>
                <ul class="sub-item">
                    <li><a class="sub-item-link" href="https://www.youtube.com/watch?v=fPjOWekzeGI" target="_blank">Сar anatomy: The Basics / How cars work? (3D animation)</a></li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="learn" checked>
                <label for="learn">Learn at freeCodeCamp</label>
                <ul class="sub-item">
                    <li><a class="sub-item-link" href="https://www.freecodecamp.org/learn/" target="_blank">freeCodeCamp</a></li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="upload-project">
                <label for="upload-project">Upload this project to GitHub</label>
                <ul class="sub-item">
                    <li><a class="sub-item-link" href="https://github.com/Denyocheq/Study-Projects" target="_blank">GitHub</a></li>
                </ul>
            </li>
            <li>
                <input type="checkbox" id="make-video">
                <label for="make-video">Make a video for YouTube</label>
                <ul class="sub-item">
                    <li><a class="sub-item-link" href="https://www.youtube.com/@Denyocheq" target="_blank">YouTube</a></li>
                </ul>
            </li>
        </ul>
    </main>
</body>

</html>
