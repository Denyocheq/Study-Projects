<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="The Earth watches the Moon with trepidation and tenderness in an endless cosmic dance. An animated CSS masterpiece with living eyes and the eternal movement of celestial bodies."
    />
    <link rel="stylesheet" href="styles.css" />
    <title>Moon Orbit</title>
  </head>

  <body>
    <div class="space">
      <div class="earth">
        <div class="eyes">
          <div class="eye left">
            <div class="inner-eye"></div>
          </div>
          <div class="eye right">
            <div class="inner-eye"></div>
          </div>
        </div>
        <div class="mouth"></div>
      </div>
      <div class="orbit">
        <div class="moon"></div>
      </div>
    </div>
  </body>
</html>
