<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Here you will find all the products you have selected.">
    <title>Checkout Page</title>
</head>
<body>
    <h1>Checkout</h1>
    <section>
        <h2>Your Cart</h2>
        <img src="https://cn19.nevsedoma.com.ua/p/23/2377/106_files/225541_1_nevsedoma_com_ua.jpg" alt="Grilled chicken-shaped AirPods case" width="500">
        <p><strong>x1 - Grilled chicken-shaped AirPods case</strong></p>
    </section>
    <section>
        <h2>Payment Information</h2>
        <form action="#" method="POST">
            <label for="card-name">Cardholder Name<span aria-hidden="true">*</span></label>
            <input id="card-name" name="card-name" type="text" required>
            <br><br>
            <label for="card-number">Card Number<span aria-hidden="true">*</span></label>
            <input id="card-number" aria-describedby="card-number-help" name="card-number" type="text" required>
            <p id="card-number-help">Please enter your 16-digit card number without spaces or dashes.</p>
            <label for="expiry-date">Expiry Date<span aria-hidden="true">*</span></label>
            <input id="expiry-date" name="expiry-date" type="text" required>
            <br><br>
            <label for="cvv">CVV<span aria-hidden="true">*</span></label>
            <input id="cvv" name="cvv" type="text" required>

            <p>* Required fields are marked.</p>
            
            <button type="Submit">Place order</button>
        </form>
    </section>
</body>
</html>
