<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Life is beautiful, smile!">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multimedia Player</title>
</head>

<body>
  <h1>Multimedia Player</h1>

  <section>
    <h2>Now Playing: Hope - Laura Platt</h2>
    <audio controls aria-label="Audio Player for Hope - Laura Platt">
      <source src="https://audiocdn.epidemicsound.com/lqmp3/01JZW8FETEZK441ENGABM0SPTB.mp3" type="audio/mpeg">
    </audio>
  </section>

  <section>
    <h2>JUST SMILE!</h2>
    <video controls width="600" aria-label="">
      <source src="https://assets.mixkit.co/videos/4557/4557-720.mp4" type="video/mp4">
      <!-- I think we don't need file for this, I'll add an aria-label -->
      <track src="#" kind="captions" aria-label="A man and a woman are smiling and lying on a bed." srclang="en" label="English">
    </video>
  </section>
  
  <section>
    <h2>Transcript</h2>
    <p>Nothing to transcript!</p>
  </section>
</body>

</html>
